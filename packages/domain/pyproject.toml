[project]
name = "robbflow-domain"
version = "0.1.0"
description = "RobbFlow domain models: WorkItem, Organization, Project, Event"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_domain"]
