[project]
name = "robbflow-workflow"
version = "0.1.0"
description = "RobbFlow workflow engine: states, transitions, conditions"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_workflow"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
