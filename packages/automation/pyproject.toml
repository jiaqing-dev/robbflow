[project]
name = "robbflow-automation"
version = "0.1.0"
description = "RobbFlow rule engine and automations"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_automation"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
