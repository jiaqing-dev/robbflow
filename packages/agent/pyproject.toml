[project]
name = "robbflow-agent"
version = "0.1.0"
description = "RobbFlow AI Agent layer (V0.4)"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
  "robbflow-workflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_agent"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
robbflow-workflow = { workspace = true }
