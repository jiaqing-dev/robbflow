[project]
name = "robbflow-integrations"
version = "0.1.0"
description = "RobbFlow Git / IM / CI integrations (V0.3)"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_integrations"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
