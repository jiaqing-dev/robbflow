[project]
name = "robbflow-api"
version = "0.2.0"
description = "RobbFlow FastAPI application"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
  "robbflow-workflow",
  "robbflow-automation",
  "robbflow-integrations",
  "robbflow-agent",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic-settings>=2.7",
  "python-jose[cryptography]>=3.3",
  "bcrypt>=4.2",
  "email-validator>=2.2",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_api"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
robbflow-workflow = { workspace = true }
robbflow-automation = { workspace = true }
robbflow-integrations = { workspace = true }
robbflow-agent = { workspace = true }
