[project]
name = "robbflow-worker"
version = "0.1.0"
description = "RobbFlow async event worker"
requires-python = ">=3.12"
dependencies = [
  "robbflow-domain",
  "robbflow-workflow",
  "robbflow-automation",
  "robbflow-agent",
  "robbflow-api",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic-settings>=2.7",
  "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robbflow_worker"]

[tool.uv.sources]
robbflow-domain = { workspace = true }
robbflow-workflow = { workspace = true }
robbflow-automation = { workspace = true }
robbflow-agent = { workspace = true }
robbflow-api = { workspace = true }
